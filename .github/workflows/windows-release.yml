name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name FileHistoryUpdates windows_monitor.py
      - name: Verify persistence across executable runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'da-state'
          $folder = Join-Path $env:RUNNER_TEMP 'da-fixture'
          New-Item -ItemType Directory -Path $folder | Out-Null
          $exe = '.\dist\FileHistoryUpdates.exe'
          $output = & $exe --folder $folder
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'Establishing initial baseline.') {
            throw "Initial scan failed: $output"
          }
          Set-Content -LiteralPath (Join-Path $folder 'probe.txt') -Value 'Test'
          $output = & $exe --folder $folder
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'ADDED: probe.txt') {
            throw "Second scan failed: $output"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FileHistoryUpdates-windows-x64
          path: dist/FileHistoryUpdates.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileHistoryUpdates-windows-x64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" FileHistoryUpdates.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
